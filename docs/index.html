<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meal tracker</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --accent: #1f6f5c;
    --over: #c0392b;
    --under: #1f6f5c;
    --none: #b8bfbc;
    --border: #dfe4e2;
    --text: #1a1a1a;
    --muted: #6b7570;
    --day-under-bg: #d9f2e3;
    --day-under-text: #1a6b45;
    --day-over-bg: #fbdcd7;
    --day-over-text: #a3352a;
    --day-none-bg: #eceeed;
    --day-none-text: #8a9490;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 40px;
  }
  header {
    background: var(--accent);
    color: white;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: white; text-decoration: none; font-size: 13px; opacity: 0.9; }
  main { max-width: 480px; margin: 0 auto; padding: 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .month-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .month-nav span { font-weight: 600; font-size: 15px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .dow {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-size: 11px;
    cursor: pointer;
    position: relative;
    background: #fafbfa;
    overflow: hidden;
  }
  .day.empty { border: none; background: none; cursor: default; }
  .day.selected { outline: 2px solid var(--accent); }
  .day.none { background: var(--day-none-bg); }
  .day.none .num, .day.none .kcal { color: var(--day-none-text); }
  .day.under { background: var(--day-under-bg); }
  .day.under .num, .day.under .kcal { color: var(--day-under-text); }
  .day.over { background: var(--day-over-bg); }
  .day.over .num, .day.over .kcal { color: var(--day-over-text); }
  .day .num { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .day .kcal {
    font-size: 10px;
    margin-top: 3px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .day.match { background: #fff7d6; border-color: #e8d27a; }
  .day.match .num, .day.match .kcal { color: var(--text); }

  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
  }

  .tag-chip {
    display: inline-block;
    background: #e7f1ee;
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    margin: 2px 4px 0 0;
  }

  .meal {
    border-top: 1px solid var(--border);
    padding: 8px 0;
    font-size: 13px;
  }
  .meal-tags { margin-top: 4px; }
  .usda-alt-block { margin-top: 8px; }
  .usda-alt-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .usda-alt-buttons { display: flex; flex-direction: column; gap: 4px; }
  .usda-alt-buttons button {
    background: white;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    text-align: left;
  }
  .usda-alt-buttons button:disabled { opacity: 0.5; }
  .usda-alt-edit-row { display: flex; gap: 4px; }
  .usda-alt-edit-row input {
    flex: 1;
    padding: 6px 8px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .usda-alt-edit-row button {
    flex-shrink: 0;
    padding: 6px 10px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--accent);
    color: white;
  }
  .meal:first-child { border-top: none; }
  .meal .items { color: var(--muted); margin-top: 2px; }
  .meal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .meal-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .meal-actions button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .meal-actions button.danger { color: var(--over); border-color: #f3c6c1; }

  .edit-form .item-row {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-top: 6px;
  }
  .edit-form .item-row input[data-role="description"] { flex: 3; min-width: 0; }
  .edit-form .item-row input[data-role="calories"] { flex: 1; min-width: 0; }
  .edit-form .item-row input {
    padding: 6px 7px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .edit-form .item-row button {
    flex-shrink: 0;
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: white;
  }
  .edit-form .item-row button.recalc { color: var(--accent); }
  .edit-form .item-row button.remove { color: var(--over); }
  .edit-form .add-item-btn {
    margin-top: 8px;
    width: 100%;
    padding: 7px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--muted);
    font-size: 12px;
  }
  .edit-form .edit-total {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .edit-form .tags-field {
    width: 100%;
    margin-top: 4px;
  }
  .edit-form .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .edit-form .row { display: flex; gap: 8px; margin-top: 8px; }
  .edit-form .row button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
  }
  .edit-form .save { background: var(--accent); color: white; }
  .edit-form .cancel { background: #eee; color: #333; }

  .add-meal {
    border-top: 1px solid var(--border);
    margin-top: 10px;
    padding-top: 10px;
  }
  .add-meal input[type="text"] { margin-bottom: 6px; }
  .add-meal textarea {
    width: 100%;
    min-height: 80px;
    max-height: 35vh;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .add-meal button {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
  }
  #add-meal-status { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .add-meal .meal-type-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .add-meal .meal-type-row button {
    flex: 1;
    min-width: 55px;
    width: auto;
    background: white;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .add-meal .meal-type-row button.selected { background: var(--accent); color: white; }

  .add-meal .photo-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .add-meal .photo-row textarea { margin-bottom: 0; }
  .add-meal .photo-row button {
    width: auto;
    flex-shrink: 0;
    padding: 0 12px;
    background: white;
    color: var(--accent);
    border: 1px solid var(--border);
    font-size: 16px;
  }
  .add-meal .photo-preview { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .add-meal .photo-preview.hidden { display: none; }
  .add-meal .photo-preview img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .add-meal .photo-preview button {
    width: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--over);
    padding: 6px 10px;
    font-size: 11px;
  }

  .day-total {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .day-total.over { color: var(--over); }
  .day-total.under { color: var(--under); }

  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .settings-row { display: flex; gap: 8px; align-items: flex-end; }
  .settings-row > div { flex: 1; }
  .settings-row button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
  }
  #settings-status { font-size: 12px; margin-top: 6px; color: var(--muted); }

  #search-results { margin-top: 10px; }
  .search-hit {
    border-top: 1px solid var(--border);
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
  }
  .search-hit:first-child { border-top: none; }
  .search-hit .date { font-weight: 600; }
  .search-hit .snippet { color: var(--muted); margin-top: 2px; }
  .search-empty { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .legend .swatch.under { background: var(--day-under-bg); border: 1px solid var(--day-under-text); }
  .legend .swatch.over { background: var(--day-over-bg); border: 1px solid var(--day-over-text); }
  .legend .swatch.none { background: var(--day-none-bg); border: 1px solid var(--border); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: white;
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 320px;
  }
  .modal h2 { font-size: 16px; margin: 0 0 10px; }
  .modal input[type="password"],
  .modal input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  .modal label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #555;
    margin-top: 8px;
  }
  .modal button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
  }
</style>
</head>
<body>
<header>
  <h1>Meal tracker</h1>
  <a href="chat.html">+ Log a meal</a>
</header>
<main>

  <div class="card">
    <div class="month-nav">
      <button id="prev" aria-label="Previous month">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span id="month-label"></span>
      <button id="next" aria-label="Next month">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
    <div class="grid" id="dow-row"></div>
    <div class="grid" id="calendar"></div>
    <div class="legend">
      <span><span class="swatch under"></span> under limit</span>
      <span><span class="swatch over"></span> over limit</span>
      <span><span class="swatch none"></span> no meals logged</span>
    </div>
  </div>

  <div class="card" id="day-detail" style="display:none;">
    <div class="day-total" id="day-total"></div>
    <div id="day-meals"></div>
    <div class="add-meal">
      <label>Add a meal to this day</label>
      <div class="meal-type-row" id="add-meal-type-row">
        <button type="button" data-type="breakfast">Breakfast</button>
        <button type="button" data-type="lunch">Lunch</button>
        <button type="button" data-type="dinner">Dinner</button>
        <button type="button" data-type="snack">Snack</button>
        <button type="button" data-type="drink">Drink</button>
      </div>
      <div class="meal-type-row" id="add-diet-type-row">
        <button type="button" data-diet="meat">Meat</button>
        <button type="button" data-diet="vegetarian">Vegetarian</button>
        <button type="button" data-diet="vegan">Vegan</button>
      </div>
      <input type="text" id="add-meal-tags" placeholder="Other tags (comma separated)" />
      <div class="photo-preview hidden" id="add-meal-photo-preview">
        <img id="add-meal-photo-preview-img" alt="Selected photo" />
        <button type="button" id="add-meal-photo-remove">Remove photo</button>
      </div>
      <div class="photo-row">
        <button type="button" id="add-meal-photo-btn" title="Add a photo of a nutrition label or menu">📷</button>
        <textarea id="add-meal-text" placeholder="e.g. 2 eggs, toast with butter (or add a photo)"></textarea>
      </div>
      <input type="file" id="add-meal-photo-file" accept="image/*" style="display:none" />
      <button id="add-meal-btn">Log meal</button>
      <div id="add-meal-status"></div>
    </div>
  </div>

  <div class="card">
    <label for="search">Search by tag or ingredient</label>
    <div class="settings-row">
      <div><input type="text" id="search" placeholder="e.g. vegetarian, chicken, lunch" /></div>
      <button id="search-btn">Search</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div class="card">
    <label for="limit-input">Daily calorie limit</label>
    <div class="settings-row">
      <div><input type="number" id="limit-input" min="1" /></div>
      <button id="save-limit">Save</button>
    </div>
    <div id="settings-status"></div>
  </div>

</main>

<div class="modal-overlay hidden" id="password-overlay">
  <div class="modal">
    <h2>Enter your app password</h2>
    <form id="password-form">
      <input
        type="password"
        id="password-input"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        autocomplete="off"
        required
      />
      <label><input type="checkbox" id="password-show" /> Show password</label>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>

<script>
  // Fill in the URL of your deployed Cloudflare Worker, e.g.
  // "https://meal-tracker.yourname.workers.dev"
  const WORKER_URL = "https://meal-tracker.anastasia-pineschi.workers.dev".replace(/\/+$/, "");

  const passwordOverlay = document.getElementById("password-overlay");
  const passwordForm = document.getElementById("password-form");
  const passwordInput = document.getElementById("password-input");
  const passwordShow = document.getElementById("password-show");

  passwordShow.addEventListener("change", () => {
    passwordInput.type = passwordShow.checked ? "text" : "password";
  });

  function ensureAppSecret() {
    const cached = localStorage.getItem("meal-tracker-secret");
    if (cached) return Promise.resolve(cached);

    return new Promise((resolve) => {
      passwordOverlay.classList.remove("hidden");
      passwordInput.value = "";
      passwordInput.focus();

      passwordForm.onsubmit = (e) => {
        e.preventDefault();
        const value = passwordInput.value;
        localStorage.setItem("meal-tracker-secret", value);
        passwordOverlay.classList.add("hidden");
        resolve(value);
      };
    });
  }

  let log = {};
  let settings = { daily_limit: 2000 };
  let current = new Date();
  current.setDate(1);
  let selectedDate = null;
  let searchTerm = "";
  let editingIndex = null;

  const monthLabel = document.getElementById("month-label");
  const calendarEl = document.getElementById("calendar");
  const dowRow = document.getElementById("dow-row");
  const dayDetail = document.getElementById("day-detail");

  function fmt(d) {
    return d.toISOString().slice(0, 10);
  }

  function dayMatchesSearch(dateStr) {
    if (!searchTerm) return false;
    const entry = log[dateStr];
    if (!entry) return false;
    return entry.meals.some((m) => {
      const inTags = m.tags.some((t) => t.includes(searchTerm));
      const inItems = m.items.some((i) => i.name.toLowerCase().includes(searchTerm));
      const inRaw = (m.raw_input || "").toLowerCase().includes(searchTerm);
      return inTags || inItems || inRaw;
    });
  }

  function renderDow() {
    dowRow.innerHTML = ["S", "M", "T", "W", "T", "F", "S"]
      .map((d) => `<div class="dow">${d}</div>`)
      .join("");
  }

  function renderCalendar() {
    monthLabel.textContent = current.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    calendarEl.innerHTML = "";

    const year = current.getFullYear();
    const month = current.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement("div");
      empty.className = "day empty";
      calendarEl.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateObj = new Date(year, month, day);
      const dateStr = fmt(dateObj);
      // Defensive against a stray {meals: [], total_calories: 0} entry (an
      // older bug could leave one behind after deleting a day's only meal) -
      // treat "no meals" as no entry at all, not as a 0-calorie logged day.
      const entry = log[dateStr] && log[dateStr].meals && log[dateStr].meals.length ? log[dateStr] : null;

      const cell = document.createElement("div");
      cell.className = "day";

      let kcalText = "";
      if (entry) {
        const over = entry.total_calories >= settings.daily_limit;
        cell.classList.add(over ? "over" : "under");
        kcalText = String(entry.total_calories);
      } else {
        cell.classList.add("none");
      }

      if (dateStr === selectedDate) cell.classList.add("selected");
      if (dayMatchesSearch(dateStr)) cell.classList.add("match");

      cell.innerHTML = `
        <div class="num">${day}</div>
        <div class="kcal">${kcalText}</div>
      `;
      cell.addEventListener("click", () => {
        selectedDate = dateStr;
        editingIndex = null;
        renderCalendar();
        renderDayDetail(dateStr);
      });
      calendarEl.appendChild(cell);
    }
  }

  function itemRowHtml(item) {
    const description = [item.quantity, item.name]
      .filter(Boolean)
      .join(" ")
      .replace(/"/g, "&quot;");
    const calories = item.calories != null ? item.calories : "";
    const unitLabel = (item.unit_label || "").replace(/"/g, "&quot;");
    const unitCalories = item.unit_calories != null ? item.unit_calories : "";
    return `<div class="item-row" data-unit-label="${unitLabel}" data-unit-calories="${unitCalories}">
      <input type="text" data-role="description" placeholder="e.g. 300g blueberries" value="${description}" />
      <input type="number" data-role="calories" placeholder="kcal" value="${calories}" />
      <button type="button" class="recalc" data-action="recalc-item" title="Recalculate from description">&#8635;</button>
      <button type="button" class="remove" data-action="remove-item" title="Remove item">&times;</button>
    </div>`;
  }

  function updateEditTotal(formEl) {
    const total = [...formEl.querySelectorAll('[data-role="calories"]')].reduce(
      (sum, inp) => sum + (Number(inp.value) || 0),
      0
    );
    const totalEl = formEl.querySelector('[data-role="edit-total-value"]');
    if (totalEl) totalEl.textContent = total;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMealView(m, i) {
    const time = new Date(m.time).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    const itemsText = m.items
      .map((it) => {
        let perUnit = "";
        if (it.unit_label && it.unit_calories != null) {
          perUnit = `, ${it.unit_calories} kcal/${escapeHtml(it.unit_label)}`;
          if (it.usda_source) {
            const linkText = escapeHtml(it.usda_food || "USDA");
            perUnit += it.usda_url
              ? ` (<a href="${it.usda_url}" target="_blank" rel="noopener noreferrer">${linkText}</a>)`
              : ` (${linkText})`;
          }
        }
        return `${escapeHtml(it.name)} (${it.calories} kcal${perUnit})`;
      })
      .join(", ");
    const tagsHtml = m.tags.length
      ? `<div class="meal-tags">${m.tags.map((t) => `<span class="tag-chip">${t}</span>`).join("")}</div>`
      : "";
    const altsHtml = m.items
      .map((it, itemIdx) => {
        if (!it.usda_source) return "";
        const label = `"${escapeHtml(it.name)}": using ${escapeHtml(it.usda_food)} (${it.calories} kcal). Not right?`;
        const idxAttrs = `data-meal-index="${i}" data-item-index="${itemIdx}"`;
        let buttons = `<button type="button" data-action="accept-usda" ${idxAttrs}>&check; Looks right</button>`;
        if (it.model_estimate) {
          buttons += `<button type="button" data-action="use-model-estimate" ${idxAttrs}>Reject USDA — use model estimate (${it.model_estimate.calories} kcal)</button>`;
        }
        buttons += (it.usda_alternatives || [])
          .map(
            (alt, altIdx) =>
              `<button type="button" data-action="use-alt" ${idxAttrs} data-alt-index="${altIdx}">${escapeHtml(alt.description)} — ${alt.calories} kcal</button>`
          )
          .join("");
        buttons += `<div class="usda-alt-edit-row"><input type="number" placeholder="Enter calories" data-role="manual-calories" /><button type="button" data-action="use-manual" ${idxAttrs}>Set</button></div>`;
        return `<div class="usda-alt-block"><div class="usda-alt-label">${label}</div><div class="usda-alt-buttons">${buttons}</div></div>`;
      })
      .join("");
    return `<div class="meal">
      <div class="meal-head">
        <strong>${time} &middot; ${m.total_calories} kcal</strong>
        <div class="meal-actions">
          <button data-action="edit" data-index="${i}">Edit</button>
          <button data-action="delete" data-index="${i}" class="danger">Delete</button>
        </div>
      </div>
      ${tagsHtml}
      <div class="items">${itemsText}</div>
      ${altsHtml}
    </div>`;
  }

  function renderMealEdit(m, i) {
    const total = m.items.reduce((sum, it) => sum + (it.calories || 0), 0);
    return `<div class="meal edit-form" data-index="${i}">
      <div class="items-list">${m.items.map(itemRowHtml).join("")}</div>
      <button type="button" class="add-item-btn" data-action="add-item">+ Add item</button>
      <div class="hint">Type your own calorie value, or edit the description and tap &#8635; to recalculate.</div>
      <div class="edit-total">Total: <span data-role="edit-total-value">${total}</span> kcal</div>
      <label style="margin-top:8px;">Tags (comma separated)</label>
      <input class="tags-field" type="text" data-role="tags" value="${m.tags.join(", ")}" />
      <div class="row">
        <button class="save" data-action="save" data-index="${i}">Save</button>
        <button class="cancel" data-action="cancel" data-index="${i}">Cancel</button>
      </div>
    </div>`;
  }

  function renderDayDetail(dateStr) {
    const entry = log[dateStr] && log[dateStr].meals && log[dateStr].meals.length ? log[dateStr] : null;
    if (!entry) {
      dayDetail.style.display = "block";
      document.getElementById("day-total").textContent = `${dateStr}: no meals logged`;
      document.getElementById("day-total").className = "day-total";
      document.getElementById("day-meals").innerHTML = "";
      dayDetail.dataset.date = dateStr;
      return;
    }

    const over = entry.total_calories >= settings.daily_limit;
    const totalEl = document.getElementById("day-total");
    totalEl.textContent = `${dateStr}: ${entry.total_calories} / ${settings.daily_limit} kcal`;
    totalEl.className = "day-total " + (over ? "over" : "under");

    document.getElementById("day-meals").innerHTML = entry.meals
      .map((m, i) => (editingIndex === i ? renderMealEdit(m, i) : renderMealView(m, i)))
      .join("");

    dayDetail.dataset.date = dateStr;
    dayDetail.style.display = "block";
  }

  document.getElementById("day-meals").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const index = Number(btn.dataset.index);
    const dateStr = dayDetail.dataset.date;

    if (btn.dataset.action === "edit") {
      editingIndex = index;
      renderDayDetail(dateStr);
    } else if (btn.dataset.action === "cancel") {
      editingIndex = null;
      renderDayDetail(dateStr);
    } else if (btn.dataset.action === "delete") {
      if (!confirm("Delete this meal entry?")) return;
      btn.disabled = true;
      try {
        const secret = await ensureAppSecret();
        const res = await fetch(WORKER_URL + "/delete-meal", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": secret },
          body: JSON.stringify({ date: dateStr, index }),
        });
        if (res.status === 401) {
          localStorage.removeItem("meal-tracker-secret");
          throw new Error("Wrong password, try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to delete");

        log[dateStr].meals.splice(index, 1);
        if (log[dateStr].meals.length === 0) {
          delete log[dateStr];
        } else {
          log[dateStr].total_calories = data.day_total;
        }
        editingIndex = null;
        renderCalendar();
        renderDayDetail(dateStr);
      } catch (err) {
        alert("Error: " + err.message);
      }
    } else if (btn.dataset.action === "add-item") {
      const list = btn.closest(".edit-form").querySelector(".items-list");
      list.insertAdjacentHTML("beforeend", itemRowHtml({ name: "", quantity: "", calories: "" }));
    } else if (btn.dataset.action === "remove-item") {
      const form = btn.closest(".edit-form");
      btn.closest(".item-row").remove();
      updateEditTotal(form);
    } else if (btn.dataset.action === "recalc-item") {
      const row = btn.closest(".item-row");
      const description = row.querySelector('[data-role="description"]').value.trim();
      if (!description) {
        alert("Enter a description first.");
        return;
      }
      const originalLabel = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = "…";
      try {
        const secret = await ensureAppSecret();
        const res = await fetch(WORKER_URL + "/estimate-item", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": secret },
          body: JSON.stringify({ description }),
        });
        if (res.status === 401) {
          localStorage.removeItem("meal-tracker-secret");
          throw new Error("Wrong password, try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to estimate");
        row.querySelector('[data-role="calories"]').value = data.calories;
        row.dataset.unitLabel = data.unit_label || "";
        row.dataset.unitCalories = data.unit_calories != null ? data.unit_calories : "";
        updateEditTotal(row.closest(".edit-form"));
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    } else if (btn.dataset.action === "save") {
      const form = btn.closest(".edit-form");
      const items = [...form.querySelectorAll(".item-row")]
        .map((row) => {
          const description = row.querySelector('[data-role="description"]').value.trim();
          const calories = Number(row.querySelector('[data-role="calories"]').value) || 0;
          const unitCaloriesRaw = row.dataset.unitCalories;
          const unitCalories =
            unitCaloriesRaw !== "" && unitCaloriesRaw != null ? Number(unitCaloriesRaw) : calories;
          return {
            name: description,
            quantity: "",
            calories,
            unit_label: row.dataset.unitLabel || description,
            unit_calories: unitCalories,
          };
        })
        .filter((it) => it.name);
      const tagsText = form.querySelector('[data-role="tags"]').value;
      if (!items.length) {
        alert("Enter at least one item.");
        return;
      }
      btn.disabled = true;
      try {
        const secret = await ensureAppSecret();
        const res = await fetch(WORKER_URL + "/edit-meal", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": secret },
          body: JSON.stringify({ date: dateStr, index, items, tags: tagsText }),
        });
        if (res.status === 401) {
          localStorage.removeItem("meal-tracker-secret");
          throw new Error("Wrong password, try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to save");

        const totalCalories = items.reduce((sum, i) => sum + i.calories, 0);
        log[dateStr].meals[index] = {
          ...log[dateStr].meals[index],
          items,
          tags: tagsText.split(",").map((t) => t.trim().toLowerCase()).filter(Boolean),
          total_calories: totalCalories,
        };
        log[dateStr].total_calories = data.day_total;
        editingIndex = null;
        renderCalendar();
        renderDayDetail(dateStr);
      } catch (err) {
        alert("Error: " + err.message);
      }
    } else if (btn.dataset.action === "accept-usda") {
      btn.closest(".usda-alt-block").remove();
    } else if (
      btn.dataset.action === "use-alt" ||
      btn.dataset.action === "use-model-estimate" ||
      btn.dataset.action === "use-manual"
    ) {
      const mealIndex = Number(btn.dataset.mealIndex);
      const itemIndex = Number(btn.dataset.itemIndex);
      const meal = log[dateStr].meals[mealIndex];
      const item = meal.items[itemIndex];

      let newFields;
      if (btn.dataset.action === "use-alt") {
        const alt = item.usda_alternatives[Number(btn.dataset.altIndex)];
        newFields = {
          calories: alt.calories,
          unit_calories: alt.unit_calories,
          usda_food: alt.description,
          usda_kcal_per_100g: alt.kcal_per_100g,
          usda_url: alt.url,
          usda_source: true,
        };
      } else if (btn.dataset.action === "use-model-estimate") {
        newFields = {
          calories: item.model_estimate.calories,
          unit_calories: item.model_estimate.unit_calories,
          unit_label: item.model_estimate.unit_label,
          usda_source: false,
        };
      } else {
        const input = btn.closest(".usda-alt-edit-row").querySelector('[data-role="manual-calories"]');
        const val = Number(input.value);
        if (!val || val <= 0) {
          alert("Enter a valid number.");
          return;
        }
        const countMatch = String(item.quantity || "").trim().match(/^([\d.]+)$/);
        const count = countMatch ? parseFloat(countMatch[1]) : null;
        const total = Math.round(val);
        newFields = { calories: total, unit_calories: count ? Math.round(total / count) : total, usda_source: false };
      }

      const block = btn.closest(".usda-alt-block");
      block.querySelectorAll("button, input").forEach((el) => (el.disabled = true));
      try {
        meal.items[itemIndex] = { ...item, ...newFields };
        meal.total_calories = meal.items.reduce((sum, it) => sum + it.calories, 0);

        const secret = await ensureAppSecret();
        const res = await fetch(WORKER_URL + "/edit-meal", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": secret },
          body: JSON.stringify({ date: dateStr, index: mealIndex, items: meal.items, tags: meal.tags.join(", ") }),
        });
        if (res.status === 401) {
          localStorage.removeItem("meal-tracker-secret");
          throw new Error("Wrong password, try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to update");

        log[dateStr].total_calories = data.day_total;
        renderCalendar();
        renderDayDetail(dateStr);
      } catch (err) {
        alert("Error: " + err.message);
        block.querySelectorAll("button, input").forEach((el) => (el.disabled = false));
      }
    }
  });

  document.getElementById("day-meals").addEventListener("input", (e) => {
    if (e.target.matches('[data-role="calories"]')) {
      updateEditTotal(e.target.closest(".edit-form"));
    }
  });

  const addMealTypeRow = document.getElementById("add-meal-type-row");
  const addDietTypeRow = document.getElementById("add-diet-type-row");
  let addMealSelectedType = null;
  let addMealSelectedDiet = null;

  addMealTypeRow.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn) return;
    const isSame = btn.dataset.type === addMealSelectedType;
    addMealTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
    addMealSelectedType = isSame ? null : btn.dataset.type;
    if (addMealSelectedType) btn.classList.add("selected");
  });

  addDietTypeRow.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-diet]");
    if (!btn) return;
    const isSame = btn.dataset.diet === addMealSelectedDiet;
    addDietTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
    addMealSelectedDiet = isSame ? null : btn.dataset.diet;
    if (addMealSelectedDiet) btn.classList.add("selected");
  });

  const addMealPhotoBtn = document.getElementById("add-meal-photo-btn");
  const addMealPhotoFile = document.getElementById("add-meal-photo-file");
  const addMealPhotoPreview = document.getElementById("add-meal-photo-preview");
  const addMealPhotoPreviewImg = document.getElementById("add-meal-photo-preview-img");
  const addMealPhotoRemove = document.getElementById("add-meal-photo-remove");
  let addMealSelectedPhoto = null;

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  addMealPhotoBtn.addEventListener("click", () => addMealPhotoFile.click());

  addMealPhotoFile.addEventListener("change", async () => {
    const file = addMealPhotoFile.files[0];
    if (!file) return;
    try {
      addMealSelectedPhoto = await resizeImage(file, 1024, 0.7);
      addMealPhotoPreviewImg.src = addMealSelectedPhoto;
      addMealPhotoPreview.classList.remove("hidden");
    } catch (err) {
      alert("Couldn't read that photo, please try again.");
    }
  });

  addMealPhotoRemove.addEventListener("click", () => {
    addMealSelectedPhoto = null;
    addMealPhotoFile.value = "";
    addMealPhotoPreview.classList.add("hidden");
  });

  document.getElementById("add-meal-btn").addEventListener("click", async () => {
    const dateStr = dayDetail.dataset.date;
    const textEl = document.getElementById("add-meal-text");
    const tagsEl = document.getElementById("add-meal-tags");
    const statusEl = document.getElementById("add-meal-status");
    const text = textEl.value.trim();
    const tags = [tagsEl.value.trim(), addMealSelectedType, addMealSelectedDiet].filter(Boolean).join(", ");
    const photoToSend = addMealSelectedPhoto;
    if (!dateStr || (!text && !photoToSend)) {
      statusEl.textContent = "Enter a description or add a photo first.";
      return;
    }

    statusEl.textContent = "Logging…";
    try {
      const secret = await ensureAppSecret();
      const res = await fetch(WORKER_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Secret": secret },
        body: JSON.stringify({ text, image: photoToSend, tags, localDate: dateStr }),
      });
      if (res.status === 401) {
        localStorage.removeItem("meal-tracker-secret");
        throw new Error("Wrong password, try again.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to log meal");

      if (!log[dateStr]) log[dateStr] = { meals: [], total_calories: 0 };
      log[dateStr].meals.push({
        time: new Date().toISOString(),
        raw_input: text || (photoToSend ? "(photo)" : ""),
        items: data.items,
        tags: data.tags || [],
        total_calories: data.meal_total,
      });
      log[dateStr].total_calories = data.total_today;

      textEl.value = "";
      tagsEl.value = "";
      addMealTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
      addDietTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
      addMealSelectedType = null;
      addMealSelectedDiet = null;
      addMealSelectedPhoto = null;
      addMealPhotoFile.value = "";
      addMealPhotoPreview.classList.add("hidden");
      statusEl.textContent = "Logged.";
      renderCalendar();
      renderDayDetail(dateStr);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });

  document.getElementById("prev").addEventListener("click", () => {
    current.setMonth(current.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("next").addEventListener("click", () => {
    current.setMonth(current.getMonth() + 1);
    renderCalendar();
  });

  function runSearch() {
    const resultsEl = document.getElementById("search-results");
    if (!searchTerm) {
      resultsEl.innerHTML = "";
      return;
    }

    const hits = [];
    Object.keys(log)
      .sort()
      .reverse()
      .forEach((dateStr) => {
        log[dateStr].meals.forEach((m) => {
          const inTags = m.tags.some((t) => t.includes(searchTerm));
          const inItems = m.items.some((it) => it.name.toLowerCase().includes(searchTerm));
          const inRaw = (m.raw_input || "").toLowerCase().includes(searchTerm);
          if (inTags || inItems || inRaw) hits.push({ dateStr, meal: m });
        });
      });

    if (!hits.length) {
      resultsEl.innerHTML = `<div class="search-empty">No meals match "${searchTerm}".</div>`;
      return;
    }

    resultsEl.innerHTML = hits
      .map((h) => {
        const itemsText = h.meal.items.map((it) => it.name).join(", ");
        const tagsText = h.meal.tags.length ? ` &middot; ${h.meal.tags.join(", ")}` : "";
        return `<div class="search-hit" data-date="${h.dateStr}">
          <div class="date">${h.dateStr} &middot; ${h.meal.total_calories} kcal</div>
          <div class="snippet">${itemsText}${tagsText}</div>
        </div>`;
      })
      .join("");
  }

  document.getElementById("search-results").addEventListener("click", (e) => {
    const hit = e.target.closest(".search-hit");
    if (!hit) return;
    const dateStr = hit.dataset.date;
    const [y, mo] = dateStr.split("-").map(Number);
    current = new Date(y, mo - 1, 1);
    selectedDate = dateStr;
    editingIndex = null;
    renderCalendar();
    renderDayDetail(dateStr);
    dayDetail.scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("search-btn").addEventListener("click", runSearch);

  document.getElementById("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      runSearch();
    }
  });

  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderCalendar();
  });

  document.getElementById("save-limit").addEventListener("click", async () => {
    const val = Number(document.getElementById("limit-input").value);
    const statusEl = document.getElementById("settings-status");
    if (!val || val <= 0) {
      statusEl.textContent = "Enter a valid number.";
      return;
    }
    statusEl.textContent = "Saving…";
    try {
      const secret = await ensureAppSecret();
      const res = await fetch(WORKER_URL + "/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Secret": secret },
        body: JSON.stringify({ daily_limit: val }),
      });
      if (res.status === 401) {
        localStorage.removeItem("meal-tracker-secret");
        throw new Error("Wrong password, try saving again.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to save");
      settings.daily_limit = data.daily_limit;
      statusEl.textContent = "Saved.";
      renderCalendar();
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });

  async function load() {
    try {
      const [logRes, settingsRes] = await Promise.all([
        fetch("log.json", { cache: "no-store" }),
        fetch("settings.json", { cache: "no-store" }),
      ]);
      log = logRes.ok ? await logRes.json() : {};
      settings = settingsRes.ok ? await settingsRes.json() : { daily_limit: 2000 };
    } catch (err) {
      console.error(err);
    }
    document.getElementById("limit-input").value = settings.daily_limit;
    renderDow();
    renderCalendar();
  }

  load();
</script>
</body>
</html>
