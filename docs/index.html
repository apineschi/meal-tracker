<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meal tracker</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --accent: #1f6f5c;
    --over: #c0392b;
    --under: #1f6f5c;
    --none: #b8bfbc;
    --border: #dfe4e2;
    --text: #1a1a1a;
    --muted: #6b7570;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 40px;
  }
  header {
    background: var(--accent);
    color: white;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: white; text-decoration: none; font-size: 13px; opacity: 0.9; }
  main { max-width: 480px; margin: 0 auto; padding: 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .month-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .month-nav span { font-weight: 600; font-size: 15px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .dow {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-size: 11px;
    cursor: pointer;
    position: relative;
    background: #fafbfa;
    overflow: hidden;
  }
  .day.empty { border: none; background: none; cursor: default; }
  .day.selected { outline: 2px solid var(--accent); }
  .day .num { font-size: 12px; font-weight: 600; }
  .day .flag { font-size: 14px; line-height: 1; margin-top: 2px; }
  .day .kcal {
    font-size: 9px;
    color: var(--muted);
    margin-top: 1px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day.match { background: #fff7d6; border-color: #e8d27a; }

  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
  }

  .tag-chip {
    display: inline-block;
    background: #e7f1ee;
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    margin: 2px 4px 0 0;
  }

  .meal {
    border-top: 1px solid var(--border);
    padding: 8px 0;
    font-size: 13px;
  }
  .meal:first-child { border-top: none; }
  .meal .items { color: var(--muted); margin-top: 2px; }
  .meal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .meal-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .meal-actions button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .meal-actions button.danger { color: var(--over); border-color: #f3c6c1; }

  .edit-form textarea {
    width: 100%;
    min-height: 70px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 6px;
  }
  .edit-form .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .edit-form .row { display: flex; gap: 8px; margin-top: 8px; }
  .edit-form .row button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
  }
  .edit-form .save { background: var(--accent); color: white; }
  .edit-form .cancel { background: #eee; color: #333; }

  .add-meal {
    border-top: 1px solid var(--border);
    margin-top: 10px;
    padding-top: 10px;
  }
  .add-meal input[type="text"] { margin-bottom: 6px; }
  .add-meal textarea {
    width: 100%;
    min-height: 50px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .add-meal button {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
  }
  #add-meal-status { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .day-total {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .day-total.over { color: var(--over); }
  .day-total.under { color: var(--under); }

  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .settings-row { display: flex; gap: 8px; align-items: flex-end; }
  .settings-row > div { flex: 1; }
  .settings-row button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
  }
  #settings-status { font-size: 12px; margin-top: 6px; color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: flex; align-items: center; gap: 4px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: white;
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 320px;
  }
  .modal h2 { font-size: 16px; margin: 0 0 10px; }
  .modal input[type="password"],
  .modal input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  .modal label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #555;
    margin-top: 8px;
  }
  .modal button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
  }
</style>
</head>
<body>
<header>
  <h1>Meal tracker</h1>
  <a href="chat.html">+ Log a meal</a>
</header>
<main>

  <div class="card">
    <label for="search">Search by tag or ingredient</label>
    <input type="text" id="search" placeholder="e.g. vegetarian, chicken, lunch" />
  </div>

  <div class="card">
    <div class="month-nav">
      <button id="prev">&larr;</button>
      <span id="month-label"></span>
      <button id="next">&rarr;</button>
    </div>
    <div class="grid" id="dow-row"></div>
    <div class="grid" id="calendar"></div>
    <div class="legend">
      <span>✅ under limit</span>
      <span>⚠️ over limit</span>
      <span>· no meals logged</span>
    </div>
  </div>

  <div class="card" id="day-detail" style="display:none;">
    <div class="day-total" id="day-total"></div>
    <div id="day-tags"></div>
    <div id="day-meals"></div>
    <div class="add-meal">
      <label>Add a meal to this day</label>
      <input type="text" id="add-meal-tags" placeholder="Tags (comma separated)" />
      <textarea id="add-meal-text" placeholder="e.g. 2 eggs, toast with butter"></textarea>
      <button id="add-meal-btn">Log meal</button>
      <div id="add-meal-status"></div>
    </div>
  </div>

  <div class="card">
    <label for="limit-input">Daily calorie limit</label>
    <div class="settings-row">
      <div><input type="number" id="limit-input" min="1" /></div>
      <button id="save-limit">Save</button>
    </div>
    <div id="settings-status"></div>
  </div>

</main>

<div class="modal-overlay hidden" id="password-overlay">
  <div class="modal">
    <h2>Enter your app password</h2>
    <form id="password-form">
      <input
        type="password"
        id="password-input"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        autocomplete="off"
        required
      />
      <label><input type="checkbox" id="password-show" /> Show password</label>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>

<script>
  // Fill in the URL of your deployed Cloudflare Worker, e.g.
  // "https://meal-tracker.yourname.workers.dev"
  const WORKER_URL = "https://meal-tracker.anastasia-pineschi.workers.dev".replace(/\/+$/, "");

  const passwordOverlay = document.getElementById("password-overlay");
  const passwordForm = document.getElementById("password-form");
  const passwordInput = document.getElementById("password-input");
  const passwordShow = document.getElementById("password-show");

  passwordShow.addEventListener("change", () => {
    passwordInput.type = passwordShow.checked ? "text" : "password";
  });

  function ensureAppSecret() {
    const cached = localStorage.getItem("meal-tracker-secret");
    if (cached) return Promise.resolve(cached);

    return new Promise((resolve) => {
      passwordOverlay.classList.remove("hidden");
      passwordInput.value = "";
      passwordInput.focus();

      passwordForm.onsubmit = (e) => {
        e.preventDefault();
        const value = passwordInput.value;
        localStorage.setItem("meal-tracker-secret", value);
        passwordOverlay.classList.add("hidden");
        resolve(value);
      };
    });
  }

  let log = {};
  let settings = { daily_limit: 2000 };
  let current = new Date();
  current.setDate(1);
  let selectedDate = null;
  let searchTerm = "";
  let editingIndex = null;

  const monthLabel = document.getElementById("month-label");
  const calendarEl = document.getElementById("calendar");
  const dowRow = document.getElementById("dow-row");
  const dayDetail = document.getElementById("day-detail");

  function fmt(d) {
    return d.toISOString().slice(0, 10);
  }

  function dayMatchesSearch(dateStr) {
    if (!searchTerm) return false;
    const entry = log[dateStr];
    if (!entry) return false;
    return entry.meals.some((m) => {
      const inTags = m.tags.some((t) => t.includes(searchTerm));
      const inItems = m.items.some((i) => i.name.toLowerCase().includes(searchTerm));
      const inRaw = (m.raw_input || "").toLowerCase().includes(searchTerm);
      return inTags || inItems || inRaw;
    });
  }

  function renderDow() {
    dowRow.innerHTML = ["S", "M", "T", "W", "T", "F", "S"]
      .map((d) => `<div class="dow">${d}</div>`)
      .join("");
  }

  function renderCalendar() {
    monthLabel.textContent = current.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    calendarEl.innerHTML = "";

    const year = current.getFullYear();
    const month = current.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement("div");
      empty.className = "day empty";
      calendarEl.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateObj = new Date(year, month, day);
      const dateStr = fmt(dateObj);
      const entry = log[dateStr];

      const cell = document.createElement("div");
      cell.className = "day";
      if (dateStr === selectedDate) cell.classList.add("selected");
      if (dayMatchesSearch(dateStr)) cell.classList.add("match");

      let flag = "·";
      let kcalText = "";
      if (entry) {
        const over = entry.total_calories >= settings.daily_limit;
        flag = over ? "⚠️" : "✅";
        kcalText = entry.total_calories + " kcal";
      }

      cell.innerHTML = `
        <div class="num">${day}</div>
        <div class="flag">${flag}</div>
        <div class="kcal">${kcalText}</div>
      `;
      cell.addEventListener("click", () => {
        selectedDate = dateStr;
        editingIndex = null;
        renderCalendar();
        renderDayDetail(dateStr);
      });
      calendarEl.appendChild(cell);
    }
  }

  function itemsToLines(items) {
    return items.map((i) => `${i.name} | ${i.quantity || ""} | ${i.calories}`).join("\n");
  }

  function parseItemLines(text) {
    return text
      .split("\n")
      .map((line) => line.trim())
      .filter(Boolean)
      .map((line) => {
        const [name, quantity, calories] = line.split("|").map((p) => (p || "").trim());
        return { name, quantity, calories: Number(calories) || 0 };
      })
      .filter((i) => i.name);
  }

  function renderMealView(m, i) {
    const time = new Date(m.time).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    const itemsText = m.items.map((it) => `${it.name} (${it.calories} kcal)`).join(", ");
    const tagsText = m.tags.length ? ` &middot; ${m.tags.join(", ")}` : "";
    return `<div class="meal">
      <div class="meal-head">
        <strong>${time} &middot; ${m.total_calories} kcal${tagsText}</strong>
        <div class="meal-actions">
          <button data-action="edit" data-index="${i}">Edit</button>
          <button data-action="delete" data-index="${i}" class="danger">Delete</button>
        </div>
      </div>
      <div class="items">${itemsText}</div>
    </div>`;
  }

  function renderMealEdit(m, i) {
    return `<div class="meal edit-form">
      <label>Items (one per line: name | quantity | calories)</label>
      <textarea data-role="items" data-index="${i}">${itemsToLines(m.items)}</textarea>
      <div class="hint">Total recalculates automatically from these calorie values.</div>
      <label style="margin-top:8px;">Tags (comma separated)</label>
      <input type="text" data-role="tags" data-index="${i}" value="${m.tags.join(", ")}" />
      <div class="row">
        <button class="save" data-action="save" data-index="${i}">Save</button>
        <button class="cancel" data-action="cancel" data-index="${i}">Cancel</button>
      </div>
    </div>`;
  }

  function renderDayDetail(dateStr) {
    const entry = log[dateStr];
    if (!entry) {
      dayDetail.style.display = "block";
      document.getElementById("day-total").textContent = `${dateStr}: no meals logged`;
      document.getElementById("day-total").className = "day-total";
      document.getElementById("day-tags").innerHTML = "";
      document.getElementById("day-meals").innerHTML = "";
      dayDetail.dataset.date = dateStr;
      return;
    }

    const over = entry.total_calories >= settings.daily_limit;
    const totalEl = document.getElementById("day-total");
    totalEl.textContent = `${dateStr}: ${entry.total_calories} / ${settings.daily_limit} kcal`;
    totalEl.className = "day-total " + (over ? "over" : "under");

    const allTags = [...new Set(entry.meals.flatMap((m) => m.tags))];
    document.getElementById("day-tags").innerHTML = allTags
      .map((t) => `<span class="tag-chip">${t}</span>`)
      .join("");

    document.getElementById("day-meals").innerHTML = entry.meals
      .map((m, i) => (editingIndex === i ? renderMealEdit(m, i) : renderMealView(m, i)))
      .join("");

    dayDetail.dataset.date = dateStr;
    dayDetail.style.display = "block";
  }

  document.getElementById("day-meals").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const index = Number(btn.dataset.index);
    const dateStr = dayDetail.dataset.date;

    if (btn.dataset.action === "edit") {
      editingIndex = index;
      renderDayDetail(dateStr);
    } else if (btn.dataset.action === "cancel") {
      editingIndex = null;
      renderDayDetail(dateStr);
    } else if (btn.dataset.action === "delete") {
      if (!confirm("Delete this meal entry?")) return;
      btn.disabled = true;
      try {
        const secret = await ensureAppSecret();
        const res = await fetch(WORKER_URL + "/delete-meal", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": secret },
          body: JSON.stringify({ date: dateStr, index }),
        });
        if (res.status === 401) {
          localStorage.removeItem("meal-tracker-secret");
          throw new Error("Wrong password, try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to delete");

        log[dateStr].meals.splice(index, 1);
        log[dateStr].total_calories = data.day_total;
        editingIndex = null;
        renderCalendar();
        renderDayDetail(dateStr);
      } catch (err) {
        alert("Error: " + err.message);
      }
    } else if (btn.dataset.action === "save") {
      const form = btn.closest(".edit-form");
      const itemsText = form.querySelector('[data-role="items"]').value;
      const tagsText = form.querySelector('[data-role="tags"]').value;
      const items = parseItemLines(itemsText);
      if (!items.length) {
        alert("Enter at least one item.");
        return;
      }
      btn.disabled = true;
      try {
        const secret = await ensureAppSecret();
        const res = await fetch(WORKER_URL + "/edit-meal", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": secret },
          body: JSON.stringify({ date: dateStr, index, items, tags: tagsText }),
        });
        if (res.status === 401) {
          localStorage.removeItem("meal-tracker-secret");
          throw new Error("Wrong password, try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to save");

        const totalCalories = items.reduce((sum, i) => sum + i.calories, 0);
        log[dateStr].meals[index] = {
          ...log[dateStr].meals[index],
          items,
          tags: tagsText.split(",").map((t) => t.trim().toLowerCase()).filter(Boolean),
          total_calories: totalCalories,
        };
        log[dateStr].total_calories = data.day_total;
        editingIndex = null;
        renderCalendar();
        renderDayDetail(dateStr);
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  });

  document.getElementById("add-meal-btn").addEventListener("click", async () => {
    const dateStr = dayDetail.dataset.date;
    const textEl = document.getElementById("add-meal-text");
    const tagsEl = document.getElementById("add-meal-tags");
    const statusEl = document.getElementById("add-meal-status");
    const text = textEl.value.trim();
    const tags = tagsEl.value.trim();
    if (!dateStr || !text) {
      statusEl.textContent = "Enter a description first.";
      return;
    }

    statusEl.textContent = "Logging…";
    try {
      const secret = await ensureAppSecret();
      const res = await fetch(WORKER_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Secret": secret },
        body: JSON.stringify({ text, tags, localDate: dateStr }),
      });
      if (res.status === 401) {
        localStorage.removeItem("meal-tracker-secret");
        throw new Error("Wrong password, try again.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to log meal");

      if (!log[dateStr]) log[dateStr] = { meals: [], total_calories: 0 };
      log[dateStr].meals.push({
        time: new Date().toISOString(),
        raw_input: text,
        items: data.items,
        tags: data.tags || [],
        total_calories: data.meal_total,
      });
      log[dateStr].total_calories = data.total_today;

      textEl.value = "";
      tagsEl.value = "";
      statusEl.textContent = "Logged.";
      renderCalendar();
      renderDayDetail(dateStr);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });

  document.getElementById("prev").addEventListener("click", () => {
    current.setMonth(current.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("next").addEventListener("click", () => {
    current.setMonth(current.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderCalendar();
  });

  document.getElementById("save-limit").addEventListener("click", async () => {
    const val = Number(document.getElementById("limit-input").value);
    const statusEl = document.getElementById("settings-status");
    if (!val || val <= 0) {
      statusEl.textContent = "Enter a valid number.";
      return;
    }
    statusEl.textContent = "Saving…";
    try {
      const secret = await ensureAppSecret();
      const res = await fetch(WORKER_URL + "/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Secret": secret },
        body: JSON.stringify({ daily_limit: val }),
      });
      if (res.status === 401) {
        localStorage.removeItem("meal-tracker-secret");
        throw new Error("Wrong password, try saving again.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to save");
      settings.daily_limit = data.daily_limit;
      statusEl.textContent = "Saved.";
      renderCalendar();
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });

  async function load() {
    try {
      const [logRes, settingsRes] = await Promise.all([
        fetch("log.json", { cache: "no-store" }),
        fetch("settings.json", { cache: "no-store" }),
      ]);
      log = logRes.ok ? await logRes.json() : {};
      settings = settingsRes.ok ? await settingsRes.json() : { daily_limit: 2000 };
    } catch (err) {
      console.error(err);
    }
    document.getElementById("limit-input").value = settings.daily_limit;
    renderDow();
    renderCalendar();
  }

  load();
</script>
</body>
</html>
