<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log a meal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f6f5c" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    --bg: #f4f6f5;
    --bubble-user: #1f6f5c;
    --bubble-user-text: #ffffff;
    --bubble-bot: #ffffff;
    --bubble-bot-text: #1a1a1a;
    --accent-over: #c0392b;
    --accent-under: #1f6f5c;
    --border: #dfe4e2;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body {
    margin: 0;
    height: 100%;
    overflow-x: hidden;
    max-width: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px calc(10px + env(safe-area-inset-top, 0px));
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: var(--bubble-user);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header a { color: white; text-decoration: none; font-size: 13px; opacity: 0.9; }
  #status {
    padding: 8px 16px;
    font-size: 13px;
    text-align: center;
    background: var(--bubble-bot);
    border-bottom: 1px solid var(--border);
  }
  #status.over { color: var(--accent-over); font-weight: 600; }
  #status.under { color: var(--accent-under); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.35;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.error {
    align-self: flex-start;
    background: #fdecea;
    color: var(--accent-over);
    border: 1px solid #f3c6c1;
  }
  .usda-alt-block { margin-bottom: 10px; }
  .usda-alt-block:last-child { margin-bottom: 0; }
  .usda-alt-label { font-size: 13px; color: #555; margin-bottom: 6px; }
  .usda-alt-buttons { display: flex; flex-direction: column; gap: 6px; }
  .usda-alt-buttons button {
    background: white;
    color: var(--bubble-user);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    text-align: left;
  }
  .usda-alt-buttons button:disabled { opacity: 0.5; }
  #chat-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: white;
    border-top: 1px solid var(--border);
  }
  .meal-type-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .meal-type-row button {
    flex: 1;
    min-width: 60px;
    background: white;
    color: var(--bubble-user);
    border: 1px solid var(--bubble-user);
    border-radius: 999px;
    padding: 6px 4px;
    font-size: 12px;
    font-weight: 600;
  }
  .meal-type-row button.selected {
    background: var(--bubble-user);
    color: white;
  }
  .input-row { display: flex; gap: 8px; }
  #photo-btn {
    background: white;
    color: var(--bubble-user);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 12px;
    font-size: 18px;
    flex-shrink: 0;
  }
  .photo-preview {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .photo-preview.hidden { display: none; }
  .photo-preview img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .photo-preview button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--accent-over);
  }
  #tags-input {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    min-height: 90px;
    max-height: 45vh;
  }
  button {
    background: var(--bubble-user);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: white;
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 320px;
  }
  .modal h2 { font-size: 16px; margin: 0 0 10px; }
  .modal input[type="password"],
  .modal input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }
  .modal label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #555;
    margin-top: 8px;
  }
  .modal button {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
  }
</style>
</head>
<body>
<header>
  <h1>Log a meal</h1>
  <a href="index.html">Calendar &rarr;</a>
</header>
<div id="status">Loading today's total&hellip;</div>
<div id="messages"></div>
<form id="chat-form">
  <div class="meal-type-row" id="meal-type-row">
    <button type="button" data-type="breakfast">Breakfast</button>
    <button type="button" data-type="lunch">Lunch</button>
    <button type="button" data-type="dinner">Dinner</button>
    <button type="button" data-type="snack">Snack</button>
    <button type="button" data-type="drink">Drink</button>
  </div>
  <div class="meal-type-row" id="diet-type-row">
    <button type="button" data-diet="meat">Meat</button>
    <button type="button" data-diet="vegetarian">Vegetarian</button>
    <button type="button" data-diet="vegan">Vegan</button>
  </div>
  <input type="text" id="tags-input" placeholder="Other tags (comma separated)" />
  <div id="photo-preview" class="photo-preview hidden">
    <img id="photo-preview-img" alt="Selected photo" />
    <button type="button" id="photo-remove">Remove photo</button>
  </div>
  <div class="input-row">
    <button type="button" id="photo-btn" title="Add a photo of a nutrition label or menu">📷</button>
    <textarea id="input" rows="4" placeholder="e.g. 2 eggs, toast with butter (or add a photo)"></textarea>
    <button type="submit" id="send-btn">Send</button>
  </div>
  <input type="file" id="photo-file" accept="image/*" style="display:none" />
</form>

<div class="modal-overlay hidden" id="password-overlay">
  <div class="modal">
    <h2>Enter your app password</h2>
    <form id="password-form">
      <input
        type="password"
        id="password-input"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        autocomplete="off"
        required
      />
      <label><input type="checkbox" id="password-show" /> Show password</label>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>

<script>
  // Fill in the URL of your deployed Cloudflare Worker, e.g.
  // "https://meal-tracker.yourname.workers.dev"
  const WORKER_URL = "https://meal-tracker.anastasia-pineschi.workers.dev".replace(/\/+$/, "");

  const passwordOverlay = document.getElementById("password-overlay");
  const passwordForm = document.getElementById("password-form");
  const passwordInput = document.getElementById("password-input");
  const passwordShow = document.getElementById("password-show");

  passwordShow.addEventListener("change", () => {
    passwordInput.type = passwordShow.checked ? "text" : "password";
  });

  function ensureAppSecret() {
    const cached = localStorage.getItem("meal-tracker-secret");
    if (cached) return Promise.resolve(cached);

    return new Promise((resolve) => {
      passwordOverlay.classList.remove("hidden");
      passwordInput.value = "";
      passwordInput.focus();

      passwordForm.onsubmit = (e) => {
        e.preventDefault();
        const value = passwordInput.value;
        localStorage.setItem("meal-tracker-secret", value);
        passwordOverlay.classList.add("hidden");
        resolve(value);
      };
    });
  }

  const messagesEl = document.getElementById("messages");
  const statusEl = document.getElementById("status");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");

  const CHAT_HISTORY_KEY = "meal-tracker-chat-history";
  const CHAT_HISTORY_LIMIT = 200;

  function saveHistoryEntry(text, kind, isHtml = false) {
    let history = [];
    try {
      history = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || "[]");
    } catch (err) {
      history = [];
    }
    history.push({ text, kind, html: isHtml });
    localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(history.slice(-CHAT_HISTORY_LIMIT)));
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function addBubble(content, kind, persist = true, isHtml = false) {
    const div = document.createElement("div");
    div.className = "bubble " + kind;
    if (isHtml) {
      div.innerHTML = content;
    } else {
      div.textContent = content;
    }
    messagesEl.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    if (persist) saveHistoryEntry(content, kind, isHtml);
  }

  function loadChatHistory() {
    let history = [];
    try {
      history = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || "[]");
    } catch (err) {
      history = [];
    }
    history.forEach((h) => addBubble(h.text, h.kind, false, h.html));
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  function updateStatus(total, limit, overLimit) {
    statusEl.textContent = `Today: ${total} / ${limit} kcal`;
    statusEl.className = overLimit ? "over" : "under";
  }

  function renderUsdaAlternatives(items, date, mealIndex, tags, totalToday, mealTotal, limit) {
    if (!Array.isArray(items) || mealIndex == null) return;
    const ambiguous = items
      .map((it, idx) => ({ it, idx }))
      .filter(({ it }) => Array.isArray(it.usda_alternatives) && it.usda_alternatives.length);
    if (!ambiguous.length) return;

    const currentItems = items.map((it) => ({ ...it }));
    const baseTotalToday = totalToday - mealTotal;

    const bubble = document.createElement("div");
    bubble.className = "bubble bot";

    ambiguous.forEach(({ it, idx }) => {
      const block = document.createElement("div");
      block.className = "usda-alt-block";

      const label = document.createElement("div");
      label.className = "usda-alt-label";
      label.textContent = `Not sure about "${it.name}"? Using: ${it.usda_food} (${it.calories} kcal)`;
      block.appendChild(label);

      const btnRow = document.createElement("div");
      btnRow.className = "usda-alt-buttons";

      it.usda_alternatives.forEach((alt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `${alt.description} — ${alt.calories} kcal`;
        btn.addEventListener("click", async () => {
          btnRow.querySelectorAll("button").forEach((b) => (b.disabled = true));
          try {
            currentItems[idx] = {
              ...currentItems[idx],
              calories: alt.calories,
              unit_calories: alt.unit_calories,
              usda_food: alt.description,
              usda_kcal_per_100g: alt.kcal_per_100g,
              usda_url: alt.url,
              usda_source: true,
            };
            const secret = await ensureAppSecret();
            const res = await fetch(WORKER_URL + "/edit-meal", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-App-Secret": secret },
              body: JSON.stringify({
                date,
                index: mealIndex,
                items: currentItems,
                tags: (tags || []).join(", "),
              }),
            });
            if (res.status === 401) {
              localStorage.removeItem("meal-tracker-secret");
              throw new Error("Wrong password, try again.");
            }
            const result = await res.json();
            if (!res.ok) throw new Error(result.error || "Failed to update");

            label.textContent = `Updated "${it.name}" to: ${alt.description} (${alt.calories} kcal)`;
            btnRow.remove();
            const newMealTotal = currentItems.reduce((sum, i) => sum + i.calories, 0);
            const newTotalToday = baseTotalToday + newMealTotal;
            updateStatus(newTotalToday, limit, newTotalToday >= limit);
          } catch (err) {
            addBubble("Error: " + err.message, "error");
            btnRow.querySelectorAll("button").forEach((b) => (b.disabled = false));
          }
        });
        btnRow.appendChild(btn);
      });

      block.appendChild(btnRow);
      bubble.appendChild(block);
    });

    messagesEl.appendChild(bubble);
    bubble.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function localDateString() {
    const d = new Date();
    const offset = d.getTimezoneOffset();
    const local = new Date(d.getTime() - offset * 60000);
    return local.toISOString().slice(0, 10);
  }

  // Best-effort initial status from the public log/settings files (read-only,
  // no Worker call needed just to display today's running total).
  async function loadInitialStatus() {
    try {
      const [logRes, settingsRes] = await Promise.all([
        fetch("log.json", { cache: "no-store" }),
        fetch("settings.json", { cache: "no-store" }),
      ]);
      const log = logRes.ok ? await logRes.json() : {};
      const settings = settingsRes.ok ? await settingsRes.json() : { daily_limit: 2000 };
      const today = localDateString();
      const total = log[today] ? log[today].total_calories : 0;
      updateStatus(total, settings.daily_limit, total >= settings.daily_limit);
    } catch (err) {
      statusEl.textContent = "Couldn't load today's total";
    }
  }

  const tagsInput = document.getElementById("tags-input");
  const mealTypeRow = document.getElementById("meal-type-row");
  const dietTypeRow = document.getElementById("diet-type-row");
  let selectedMealType = null;
  let selectedDiet = null;

  mealTypeRow.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn) return;
    const isSame = btn.dataset.type === selectedMealType;
    mealTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
    selectedMealType = isSame ? null : btn.dataset.type;
    if (selectedMealType) btn.classList.add("selected");
  });

  dietTypeRow.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-diet]");
    if (!btn) return;
    const isSame = btn.dataset.diet === selectedDiet;
    dietTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
    selectedDiet = isSame ? null : btn.dataset.diet;
    if (selectedDiet) btn.classList.add("selected");
  });

  const photoBtn = document.getElementById("photo-btn");
  const photoFile = document.getElementById("photo-file");
  const photoPreview = document.getElementById("photo-preview");
  const photoPreviewImg = document.getElementById("photo-preview-img");
  const photoRemove = document.getElementById("photo-remove");
  let selectedPhoto = null;

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  photoBtn.addEventListener("click", () => photoFile.click());

  photoFile.addEventListener("change", async () => {
    const file = photoFile.files[0];
    if (!file) return;
    try {
      selectedPhoto = await resizeImage(file, 1024, 0.7);
      photoPreviewImg.src = selectedPhoto;
      photoPreview.classList.remove("hidden");
    } catch (err) {
      alert("Couldn't read that photo, please try again.");
    }
  });

  photoRemove.addEventListener("click", () => {
    selectedPhoto = null;
    photoFile.value = "";
    photoPreview.classList.add("hidden");
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    const tags = [tagsInput.value.trim(), selectedMealType, selectedDiet].filter(Boolean).join(", ");
    if (!text && !selectedPhoto) return;

    const photoToSend = selectedPhoto;
    const bubbleText = photoToSend ? (text ? `📷 ${text}` : "📷 (photo)") : text;
    addBubble(tags ? `${bubbleText}\n[tags: ${tags}]` : bubbleText, "user");
    input.value = "";
    input.style.height = "auto";
    tagsInput.value = "";
    mealTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
    dietTypeRow.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
    selectedMealType = null;
    selectedDiet = null;
    selectedPhoto = null;
    photoFile.value = "";
    photoPreview.classList.add("hidden");
    input.disabled = true;
    document.getElementById("send-btn").disabled = true;

    try {
      const secret = await ensureAppSecret();
      const res = await fetch(WORKER_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Secret": secret },
        body: JSON.stringify({ text, image: photoToSend, tags, localDate: localDateString() }),
      });
      if (res.status === 401) {
        localStorage.removeItem("meal-tracker-secret");
        throw new Error("Wrong password, try sending your message again.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong");

      addBubble(data.reply && data.reply.trim() ? data.reply : "Logged.", "bot");
      if (Array.isArray(data.items) && data.items.length) {
        const lines = data.items.map((i) => {
          const name = escapeHtml(i.name) + (i.quantity ? ` (${escapeHtml(i.quantity)})` : "");
          let unitPart = "";
          if (i.unit_label && i.unit_calories != null) {
            unitPart = `${i.unit_calories} kcal per ${escapeHtml(i.unit_label)}`;
            if (i.usda_source) {
              const linkText = escapeHtml(i.usda_food || "USDA");
              unitPart += i.usda_url
                ? `, <a href="${i.usda_url}" target="_blank" rel="noopener noreferrer">${linkText}</a>`
                : `, ${linkText}`;
            }
          }
          return `${name} — ${i.calories} kcal${unitPart ? ` [${unitPart}]` : ""}`;
        });
        lines.push("");
        lines.push(`Total: ${data.meal_total} kcal`);
        if (Array.isArray(data.tags) && data.tags.length) {
          lines.push(`Tags: ${data.tags.join(", ")}`);
        }
        addBubble(lines.join("\n"), "bot", true, true);
        renderUsdaAlternatives(data.items, data.date, data.meal_index, data.tags, data.total_today, data.meal_total, data.limit);
      }
      updateStatus(data.total_today, data.limit, data.over_limit);
      if (data.over_limit) {
        const over = data.total_today - data.limit;
        addBubble(`⚠️ That puts you ${over} kcal over today's ${data.limit} kcal limit.`, "bot");
      }
    } catch (err) {
      addBubble("Error: " + err.message, "error");
    } finally {
      input.disabled = false;
      document.getElementById("send-btn").disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  loadChatHistory();
  loadInitialStatus();
</script>
</body>
</html>
